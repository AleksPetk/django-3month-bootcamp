{% extends "base.html" %}

{% block title %}Delete {{page_title_name}}{% endblock %}

{% block content %}

    <section class="page_s">
        <h2>Delete ID: {{object.id}}</h2>
        <p>Are you sure you want to delete {{page_title_name}}</p>
    </section>
    <section>
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Delete</button>
            <a href="{% url cancel_url %}">Cancel</a>
        </form>
    </section>


{% endblock %}
