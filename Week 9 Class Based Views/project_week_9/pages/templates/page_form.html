{% extends "base.html" %}

{% block title %}{{page_title}}{% endblock %}

{% block content %}
    <h2>{{page_title}}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
        <a href="{% url cancel_url %}">Cancel</a>
    </form>
{% endblock %}
