<header>
    <div class="header_text">
        <h1>Week 9 Project</h1>
        {% if user.is_authenticated %}
            <p>{{user.username}}</p>
        {% else %}
            <p>Guest</p>
        {% endif %}
    </div>
    <nav>
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active_link{% endif %}">Home</a>
        <a href="{% url 'games' %}" class="{% if request.resolver_match.url_name == 'games' %}active_link{% endif %}">Games</a>
        {% if user.is_authenticated %}
            {% include "_logout.html" %}
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
</header>
