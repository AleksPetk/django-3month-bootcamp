{% extends "base.html" %}

{% block title %}{{page_title}}{% endblock %}

{% block content %}

    <h2>{{page_title}}</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">{{button_name}}</button>
        {% if login_url %}
            <p>Already registered? <a href="{% url login_url %}">Login Here</a></p>
        {% endif %}
        <a href="{% url cancel_url %}">Cancel</a>
    </form>

{% endblock %}
