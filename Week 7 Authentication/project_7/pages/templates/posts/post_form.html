{% extends "base.html" %}

{% block title %}
    Create Post
{% endblock %}

{% block content %}
    <section class="page_s">
        <h2>Create New Post</h2>
        <p>Let's create the best unique post.</p>
    </section>
    <section class="page_c">
        {% if error %}
            <p>{{error}}</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Enter Title" value="{{title}}" required>
            <textarea name="content" placeholder="Enter Content" required>{{content}}</textarea>
            <label>
                <input type="checkbox" name="published" {% if published %}checked{% endif %}>
                Published
            </label>
            <button type="submit">Create</button>
        </form>
    </section>

{% endblock %}
