<header>
    <h1>Project 7</h1>
    {% if user.is_authenticated %}
        <p>{{user.username}}</p>
    {% else %}
        <p>Guest</p>
    {% endif %}
    <nav>
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active_link{% endif %}">Home</a>
        <a href="{% url 'posts' %}" class="{% if request.resolver_match.url_name == 'posts' %}active_link{% endif %}">Posts</a>
        {% if user.is_authenticated %}
            {% include "login/_logout.html" %}
            {% if user.posts.exists %}
                <a href="{% url 'my_posts' %}">My posts</a>
            {% endif %}
        {% else %}
            <a href="{% url 'login' %}" class="{% if request.resolver_match.url_name == 'login' %}active_link{% endif %}">Login</a>
        {% endif %}
    </nav>
</header>
