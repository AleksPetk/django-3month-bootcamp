<section class="module" aria-labelledby="japan47-dashboard-title">
  <h2 id="japan47-dashboard-title">Japan 47 overview</h2>
  <table>
    <caption class="visually-hidden">Current content and moderation totals</caption>
    <tbody>
      <tr><th scope="row">Places awaiting review</th><td>{{ pending_places }}</td></tr>
      <tr><th scope="row">Published places</th><td>{{ published_places }}</td></tr>
      <tr><th scope="row">Open reports</th><td>{{ open_reports }}</td></tr>
      <tr><th scope="row">Reviews</th><td>{{ reviews }}</td></tr>
    </tbody>
  </table>
</section>
