<header>
    <div class="header_title">
        <h1>Week 10 Files</h1>
        {% if user.is_authenticated %}
            <p>{{user.username}}</p>
        {% else %}
            <p>Guest</p>
        {% endif %}
    </div>
    <nav>
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == home %}active_link{% endif %}">Home</a>
        <a href="{% url 'blog_list' %}" class="{% if request.resolver_match.url_name == blog_list %}active_link{% endif %}">Blog</a>
        {% if user.is_authenticated %}
            {% include "_logout.html" %}
            <a href="{% url 'profile_edit' %}">Profile Edit</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
</header>
