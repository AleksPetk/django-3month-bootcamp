{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account yet?</p>
    <a href="{% url 'register' %}">Register Here</a>


{% endblock %}
