<header>

            <p>{{user.username}}</p>
        {% else %}
            <p>Guest</p>
        {% endif %}
    </div>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'devblogs' %}">DevBlogs</a>

        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
</header>
