{% extends "base.html" %}

{% block title %}{{page_title}}{% endblock %}

{% block content %}
    <h2>{{page_title}}</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">{{button_name}}</button>
    </form>
    <a href="{% url cancel_url %}">Cancel</a>
{% endblock %}
